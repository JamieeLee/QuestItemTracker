name: QIT Lua checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.3
      - name: Parse addon source and tests
        run: |
          luac5.3 -p QuestItemTracker/QuestItemTracker.lua
          luac5.3 -p tests/faction_and_source_items.lua
          luac5.3 -p tests/minimap_options.lua
          luac5.3 -p tests/quest_item_pathways.lua
      - name: Run mock Forever compatibility tests
        run: |
          lua5.3 tests/faction_and_source_items.lua
          lua5.3 tests/minimap_options.lua
          lua5.3 tests/quest_item_pathways.lua
      - name: Test ZIP and release notes builder
        run: |
          python3 -m unittest discover -s tests -p 'test_release_builder.py' -v

      - name: Validate one changelog and current version entry
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^## Version: //p' QuestItemTracker/QuestItemTracker.toc)
          test -n "$VERSION"
          test -f CHANGELOG.md
          COUNT=$(grep -Fc "## [${VERSION}] - " CHANGELOG.md || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "CHANGELOG.md must contain exactly one '## [${VERSION}] - DATE' entry for the current addon version"
            exit 1
          fi
          EXTRA=$(find . -type f \( -iname '*changelog*.md' -o -iname '*release*notes*.md' -o -iname '*release*log*.md' -o -iname 'v[0-9]*.md' \) ! -path './CHANGELOG.md' -print)
          if [ -n "$EXTRA" ]; then
            echo "All release history belongs in CHANGELOG.md; remove duplicate release Markdown:"
            echo "$EXTRA"
            exit 1
          fi

      - name: Build and check test installable folder
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_builder.py build --output dist
          VERSION=$(sed -n 's/^## Version: //p' QuestItemTracker/QuestItemTracker.toc)
          unzip -t "dist/QITForeverV${VERSION}.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Upload unpacked addon as test artifact (NO nested ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: QITForeverV${{ steps.build.outputs.version }}-test
          path: dist/staging/
          if-no-files-found: error