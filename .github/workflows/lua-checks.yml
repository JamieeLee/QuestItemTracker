name: QIT Lua checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.3
      - name: Parse addon source and tests
        run: |
          luac5.3 -p QuestItemTracker/QuestItemTracker.lua
          luac5.3 -p tests/faction_and_source_items.lua
          luac5.3 -p tests/minimap_options.lua
          luac5.3 -p tests/quest_item_pathways.lua
          luac5.3 -p tests/audit_regressions.lua
      - name: Run mock Forever compatibility tests
        run: |
          lua5.3 tests/faction_and_source_items.lua
          lua5.3 tests/minimap_options.lua
          lua5.3 tests/quest_item_pathways.lua
          lua5.3 tests/audit_regressions.lua
      - name: Test ZIP and release notes builder
        run: |
          python3 -m unittest discover -s tests -p 'test_release_builder.py' -v

      - name: Validate one changelog and current version entry
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^## Version: //p' QuestItemTracker/QuestItemTracker.toc)
          test -n "$VERSION"
          test -f CHANGELOG.md
          COUNT=$(grep -Fc "## [${VERSION}] - " CHANGELOG.md || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "CHANGELOG.md must contain exactly one '## [${VERSION}] - DATE' entry for the current addon version"
            exit 1
          fi
          EXTRA=$(find . -type f \( -iname '*changelog*.md' -o -iname '*release*notes*.md' -o -iname '*release*log*.md' -o -iname 'v[0-9]*.md' \) ! -path './CHANGELOG.md' -print)
          if [ -n "$EXTRA" ]; then
            echo "All release history belongs in CHANGELOG.md; remove duplicate release Markdown:"
            echo "$EXTRA"
            exit 1
          fi

      - name: Require a new version for addon-code PRs
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_BRANCH"
          if git diff --name-only FETCH_HEAD HEAD | grep -Eq '^QuestItemTracker/QuestItemTracker\.(lua|toc)$'; then
            OLD=$(git show FETCH_HEAD:QuestItemTracker/QuestItemTracker.toc | sed -n 's/^## Version: //p')
            NEW=$(sed -n 's/^## Version: //p' QuestItemTracker/QuestItemTracker.toc)
            python3 -c 'import sys; old=tuple(map(int,sys.argv[1].split("."))); new=tuple(map(int,sys.argv[2].split("."))); assert new > old, f"Addon code changed without a newer version: {old} -> {new}"; print(f"Version advanced: {old} -> {new}")' "$OLD" "$NEW"
          fi

      - name: Build and check test installable folder
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_builder.py build --output dist
          VERSION=$(sed -n 's/^## Version: //p' QuestItemTracker/QuestItemTracker.toc)
          unzip -t "dist/QITForeverV${VERSION}.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Upload unpacked addon as test artifact (NO nested ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: QITForeverV${{ steps.build.outputs.version }}-test
          path: dist/staging/
          if-no-files-found: error


  # Only a successful MAIN branch build may publish. PRs just run the tests.
  # A merge with the same version (docs/CI edits) is skipped automatically.
  publish_github:
    name: Publish version to GitHub (after passing checks)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: lua
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: qit-forever-github-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version, changelog and existing GitHub release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^## Version: //p' QuestItemTracker/QuestItemTracker.toc)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Invalid addon version'; exit 1; }
          TAG="v${VERSION}"
          python3 scripts/release_builder.py validate --tag "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; no duplicate upload."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never move an existing tag. Existing tags without a release can be
          # recovered only when they already point to exactly this commit.
          if TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null); then
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "::warning::Tag $TAG points at $TAG_SHA (not $GITHUB_SHA). Skipping; a release must never silently retag existing code."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Build single installable ZIP and required-QuestieDB release notes
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release_builder.py build --tag "$TAG" --output dist
          unzip -t "dist/QITForeverV${VERSION}.zip"
          grep -Fq 'QuestieDB is REQUIRED' dist/release-notes.md

      - name: Create version tag and publish GitHub release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG_EXISTS: ${{ steps.release.outputs.tag_exists }}
        run: |
          set -euo pipefail
          # GitHub's GITHUB_TOKEN-created tag does not trigger the separate
          # tag-push release workflow, so this job publishes GitHub only.
          # CurseForge remains an explicit/manual release choice.
          if [[ "$TAG_EXISTS" != "true" ]]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="$GITHUB_SHA" >/dev/null
          fi
          gh release create "$TAG" "dist/QITForeverV${VERSION}.zip" \
            --title "QIT-v${VERSION}" \
            --notes-file dist/release-notes.md \
            --repo "$GITHUB_REPOSITORY"
          echo "Published GitHub release $TAG from $GITHUB_SHA; CurseForge untouched."
