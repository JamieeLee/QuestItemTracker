name: QIT Lua checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.3
      - name: Parse addon source and tests
        run: |
          luac5.3 -p QuestItemTracker/QuestItemTracker.lua
          luac5.3 -p tests/faction_and_source_items.lua
          luac5.3 -p tests/minimap_options.lua
          luac5.3 -p tests/quest_item_pathways.lua
          luac5.3 -p tests/audit_regressions.lua
      - name: Run mock Forever compatibility tests
        run: |
          lua5.3 tests/faction_and_source_items.lua
          lua5.3 tests/minimap_options.lua
          lua5.3 tests/quest_item_pathways.lua
          lua5.3 tests/audit_regressions.lua
      - name: Test ZIP and release notes builder
        run: |
          python3 -m unittest discover -s tests -p 'test_release_builder.py' -v

      - name: Validate one changelog and current version entry
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^## Version: //p' QuestItemTracker/QuestItemTracker.toc)
          test -n "$VERSION"
          test -f CHANGELOG.md
          COUNT=$(grep -Fc "## [${VERSION}] - " CHANGELOG.md || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "CHANGELOG.md must contain exactly one '## [${VERSION}] - DATE' entry for the current addon version"
            exit 1
          fi
          EXTRA=$(find . -type f \( -iname '*changelog*.md' -o -iname '*release*notes*.md' -o -iname '*release*log*.md' -o -iname 'v[0-9]*.md' \) ! -path './CHANGELOG.md' -print)
          if [ -n "$EXTRA" ]; then
            echo "All release history belongs in CHANGELOG.md; remove duplicate release Markdown:"
            echo "$EXTRA"
            exit 1
          fi

      - name: Require a new version for addon-code PRs
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_BRANCH"
          if git diff --name-only FETCH_HEAD HEAD | grep -Eq '^QuestItemTracker/QuestItemTracker\.(lua|toc)$'; then
            OLD=$(git show FETCH_HEAD:QuestItemTracker/QuestItemTracker.toc | sed -n 's/^## Version: //p')
            NEW=$(sed -n 's/^## Version: //p' QuestItemTracker/QuestItemTracker.toc)
            python3 -c 'import sys; old=tuple(map(int,sys.argv[1].split("."))); new=tuple(map(int,sys.argv[2].split("."))); assert new > old, f"Addon code changed without a newer version: {old} -> {new}"; print(f"Version advanced: {old} -> {new}")' "$OLD" "$NEW"
          fi

      - name: Build and check test installable folder
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_builder.py build --output dist
          VERSION=$(sed -n 's/^## Version: //p' QuestItemTracker/QuestItemTracker.toc)
          unzip -t "dist/QITForeverV${VERSION}.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Upload unpacked addon as test artifact (NO nested ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: QITForeverV${{ steps.build.outputs.version }}-test
          path: dist/staging/
          if-no-files-found: error


  # Only a successful MAIN branch build may publish. PRs just run the tests.
  # A merge with the same version (docs/CI edits) is skipped automatically.
  publish_github:
    name: Publish version to GitHub + CurseForge (after passing checks)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: lua
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: qit-forever-github-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version, changelog and existing GitHub release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^## Version: //p' QuestItemTracker/QuestItemTracker.toc)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Invalid addon version'; exit 1; }
          TAG="v${VERSION}"
          python3 scripts/release_builder.py validate --tag "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # GitHub and CurseForge track completion independently. A failed
          # CurseForge upload is retryable without recreating the GitHub release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [[ "$DRAFT" == "true" ]]; then
              echo "publish_gh=true" >> "$GITHUB_OUTPUT"
              echo "draft_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "GitHub release $TAG already published; will not create another."
              echo "publish_gh=false" >> "$GITHUB_OUTPUT"
              echo "draft_exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish_gh=true" >> "$GITHUB_OUTPUT"
            echo "draft_exists=false" >> "$GITHUB_OUTPUT"
          fi

          # Never silently replace a release tag or publish an untested commit.
          if TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null); then
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]] &&
               ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Existing version tag $TAG points at a different commit."
              exit 1
            fi
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          # A separate lightweight tag records a *successful* CurseForge upload.
          # GitHub's tag-push workflow only matches vX.Y tags, not these markers.
          # CI-only merges and reruns won't upload the same release again.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/curseforge-${TAG}" >/dev/null 2>&1; then
            echo "CurseForge already uploaded $TAG; skipping duplicate."
            echo "publish_cf=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_cf=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build single installable ZIP and required-QuestieDB release notes
        if: steps.release.outputs.publish_gh == 'true' || steps.release.outputs.publish_cf == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          CF_GAME_VERSION_IDS: ${{ vars.CF_GAME_VERSION_IDS || secrets.CF_GAME_VERSION_IDS }}
        run: |
          set -euo pipefail
          python3 scripts/release_builder.py build --tag "$TAG" --output dist
          unzip -t "dist/QITForeverV${VERSION}.zip"
          grep -Fq 'QuestieDB is REQUIRED' dist/release-notes.md

      - name: Create version tag and publish GitHub release
        if: steps.release.outputs.publish_gh == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG_EXISTS: ${{ steps.release.outputs.tag_exists }}
          DRAFT_EXISTS: ${{ steps.release.outputs.draft_exists }}
        run: |
          set -euo pipefail
          # GitHub's GITHUB_TOKEN-created tag does not trigger the separate
          # tag-push release workflow, so this job publishes GitHub only.
          # CurseForge remains an explicit/manual release choice.
          if [[ "$TAG_EXISTS" != "true" ]]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="$GITHUB_SHA" >/dev/null
          fi
          if [[ "$DRAFT_EXISTS" == "true" ]]; then
            gh release upload "$TAG" "dist/QITForeverV${VERSION}.zip" \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --draft=false \
              --title "QIT-v${VERSION}" \
              --notes-file dist/release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "dist/QITForeverV${VERSION}.zip" \
              --title "QIT-v${VERSION}" \
              --notes-file dist/release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "Published GitHub release $TAG from $GITHUB_SHA."

      - name: Upload the same version ZIP and patch notes to CurseForge automatically
        if: steps.release.outputs.publish_cf == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          GH_PUBLISH: ${{ steps.release.outputs.publish_gh }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID || secrets.CF_PROJECT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          # Configuration problems MUST fail visibly, not silently skip releases.
          [[ -n "$CF_API_TOKEN" ]] || { echo "::error::Missing secret CF_API_TOKEN"; exit 1; }
          [[ "$CF_PROJECT_ID" =~ ^[0-9]+$ ]] || { echo "::error::Missing or invalid CF_PROJECT_ID"; exit 1; }

          FILE="dist/QITForeverV${VERSION}.zip"
          # When backfilling CurseForge for an already published GitHub release,
          # download the exact existing asset rather than repackaging different bytes.
          if [[ "$GH_PUBLISH" != "true" ]]; then
            rm -f "$FILE"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "QITForeverV${VERSION}.zip" --dir dist
          fi
          unzip -t "$FILE"

          curl --fail-with-body --show-error --silent --retry 2 \
            -H "X-Api-Token: $CF_API_TOKEN" \
            -F 'metadata=<dist/curseforge-metadata.json' \
            -F "file=@${FILE};type=application/zip" \
            "https://wow.curseforge.com/api/projects/${CF_PROJECT_ID}/upload-file" \
            --output dist/curseforge-response.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          response = json.loads(Path("dist/curseforge-response.json").read_text())
          file_id = response.get("id") if isinstance(response, dict) else None
          if not isinstance(file_id, int) or file_id <= 0:
              raise SystemExit("CurseForge did not return a valid file ID; no success marker created")
          print(f"CurseForge accepted file ID {file_id}")
          PY

          # Commit-independent marker makes reruns and later CI-only merges
          # idempotent, without additional Markdown files or release ZIPs.
          RELEASE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/curseforge-${TAG}" -f sha="$RELEASE_SHA" >/dev/null
          echo "CurseForge upload recorded for $TAG."
